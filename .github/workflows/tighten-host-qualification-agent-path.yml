name: tighten-host-qualification-agent-path
on:
  push:
    branches: [fix/host-runtime-evidence-resolvers]
permissions:
  contents: write
jobs:
  tighten:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 2}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: {python-version: '3.11'}
      - name: Guard exact parent
        run: |
          test "$(git rev-parse HEAD^)" = "3bbe5bb030fff0a805612180ad1d8645aecbfda4"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/tighten-host-qualification-agent-path.yml"
      - run: python -m pip install -r requirements-dev.txt
      - name: Add N2 resolver canonical-path tests
        shell: python
        run: |
          from pathlib import Path
          p = Path('tests/test_host_qualification_evidence_resolver_scope.py')
          s = p.read_text(encoding='utf-8')
          addition = '''

          import pytest


          @pytest.mark.parametrize(
              "task_path",
              ["/root/BadName", "/root/bad-name", "/root/bad.name", "/root/root", "/root/parent/child"],
          )
          def test_task_address_resolver_rejects_noncanonical_or_nonleaf_managed_path(
              tmp_path: Path, task_path: str
          ):
              sessions = tmp_path / "sessions"
              sessions.mkdir()
              result = subprocess.run(
                  [sys.executable, str(EVIDENCE), "--sessions-dir", str(sessions),
                   "resolve-child", "--agent-path", task_path,
                   "--since", "2026-08-26T00:00:00Z"],
                  cwd=ROOT, text=True, capture_output=True, check=False,
              )
              assert result.returncode != 0
              assert "canonical /root/<task>" in result.stderr
          '''
          addition = '\n'.join(line[10:] if line.startswith('          ') else line for line in addition.splitlines()) + '\n'
          if 'test_task_address_resolver_rejects_noncanonical_or_nonleaf_managed_path' in s:
              raise SystemExit('regression test already exists')
          p.write_text(s + addition, encoding='utf-8')
      - name: Prove tests red
        run: |
          if python -m pytest -q tests/test_host_qualification_evidence_resolver_scope.py -k noncanonical_or_nonleaf; then
            echo 'expected resolver tests to fail before implementation' >&2
            exit 1
          fi
      - name: Tighten resolver and docs
        shell: python
        run: |
          from pathlib import Path
          p = Path('scripts/host_qualification_evidence.py')
          s = p.read_text(encoding='utf-8')
          old = 'AGENT_PATH = re.compile(r"^/root/[A-Za-z0-9_][A-Za-z0-9._-]*$")\n'
          new = 'AGENT_PATH = re.compile(r"^/root/(?!root$)[a-z0-9_]+$")\n'
          if s.count(old) != 1:
              raise SystemExit('maintainer AgentPath regex mismatch')
          p.write_text(s.replace(old, new), encoding='utf-8')

          p = Path('tasks/host-qualification-runtime-evidence.md')
          s = p.read_text(encoding='utf-8')
          needle = 'Only `session_meta.agent_path` is eligible for the match. Task-address text found in prompts, reasoning, messages, results, or other payloads is ignored.\n'
          extra = needle + '\nFor managed qualification children, the resolver accepts exactly one direct `/root/<task>` segment using the same lowercase-letter/digit/underscore segment rules as upstream `AgentPath`, with `root` reserved. Nested paths remain valid upstream V2 identities in general, but are rejected here because this resolver is for product-managed leaf children.\n'
          if s.count(needle) != 1:
              raise SystemExit('N2 doc marker mismatch')
          p.write_text(s.replace(needle, extra), encoding='utf-8')
      - name: Verify
        run: |
          python -m pytest -q tests/test_host_qualification_evidence.py tests/test_host_qualification_evidence_fail_closed.py tests/test_host_qualification_evidence_resolver_scope.py tests/test_runtime_attestation.py
          python -m ruff check scripts/host_qualification_evidence.py scripts/runtime-evidence.py tests/test_host_qualification_evidence.py tests/test_host_qualification_evidence_fail_closed.py tests/test_host_qualification_evidence_resolver_scope.py tests/test_runtime_attestation.py --ignore E402
          python scripts/package_integrity.py --check-generated
          python scripts/package_integrity.py
          git diff --check
      - name: Self-delete and commit
        run: |
          rm .github/workflows/tighten-host-qualification-agent-path.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: align Host qualifier with V2 AgentPath rules'
          git push origin HEAD:fix/host-runtime-evidence-resolvers
