name: rc4-doctor-core-sync

on:
  push:
    branches:
      - v4/rc4-host-contract-closure

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: v4/rc4-host-contract-closure
          fetch-depth: 0
      - name: Sync Doctor core fallback to RC4 static Host contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/doctor_runtime_core.py')
          text = path.read_text(encoding='utf-8')

          old_constants = 'EXPECTED_SKILLS = ("orchestrate", "doctor")\nEXPECTED_HOST_PROBES = tuple(f"H{index:02d}" for index in range(11))\n'
          new_constants = '''EXPECTED_SKILLS = ("orchestrate", "doctor")\nEXPECTED_HOST_PROBES = release_evidence_v4.REQUIRED_HOST_PROBES\nHOST_CONTRACT_VERSION = release_evidence_v4.HOST_CAMPAIGN_CONTRACT_VERSION\nHOST_ENVIRONMENT_FIELDS = sorted(release_evidence_v4.HOST_ENVIRONMENT_FIELDS)\nHOST_RESULT_FIELDS = sorted(release_evidence_v4.HOST_RESULT_FIELDS)\n'''
          if old_constants not in text:
              raise SystemExit('Doctor core expected-probe constants no longer match the RC4 red baseline')
          text = text.replace(old_constants, new_constants, 1)

          pattern = re.compile(
              r'def _validate_host_smoke_evidence\(smoke: Mapping\[str, Any\]\) -> tuple\[bool, bool, str \| None\]:\n.*?\n\ndef parse_args\(\) -> argparse\.Namespace:',
              re.DOTALL,
          )
          replacement = '''def _validate_host_smoke_evidence(smoke: Mapping[str, Any]) -> tuple[bool, bool, str | None]:\n    """Validate the tracked H00-H20 Host contract; runtime PASS stays external."""\n    if not isinstance(smoke, Mapping):\n        return False, False, "Host-smoke contract must be an object"\n    if smoke.get("schema_version") != HOST_CONTRACT_VERSION:\n        return False, False, "Host-smoke contract schema_version is unsupported"\n    if smoke.get("status") != "PENDING":\n        return False, False, "tracked Host-smoke contract must remain PENDING"\n    required = smoke.get("required_probes")\n    if not isinstance(required, list):\n        return False, False, "Host-smoke required_probes must be an array"\n    ids = [item.get("id") for item in required if isinstance(item, Mapping)]\n    if len(ids) != len(required) or tuple(ids) != EXPECTED_HOST_PROBES:\n        return False, False, "Host-smoke required probes must be exactly ordered H00-H20"\n    if smoke.get("required_environment_fields") != HOST_ENVIRONMENT_FIELDS:\n        return False, False, "Host-smoke environment field contract is unsupported"\n    if smoke.get("required_result_fields") != HOST_RESULT_FIELDS:\n        return False, False, "Host-smoke result field contract is unsupported"\n    h20 = next(\n        (item for item in required if isinstance(item, Mapping) and item.get("id") == "H20"),\n        None,\n    )\n    if not isinstance(h20, Mapping) or h20.get("platform") != "windows":\n        return False, False, "Host-smoke H20 must require Windows"\n    if smoke.get("results") != {}:\n        return False, False, "tracked Host-smoke contract cannot contain authoritative runtime results"\n    return True, False, None\n\n\ndef parse_args() -> argparse.Namespace:'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Doctor core validator replacement count was {count}, expected 1')

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- scripts/doctor_runtime_core.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/doctor_runtime_core.py
          git commit -m "fix(v4): align Doctor core with H00-H20 static contract"
          git push origin HEAD:v4/rc4-host-contract-closure
