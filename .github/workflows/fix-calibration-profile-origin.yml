name: fix-calibration-profile-origin

on:
  push:
    branches:
      - fix/host-runtime-evidence-resolvers

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Guard exact parent
        run: |
          test "$(git rev-parse HEAD^)" = "ea63a7a4a278e67f6e62258419c556ab533f5d9d"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/fix-calibration-profile-origin.yml"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Confirm exact regression remains red
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_experiment_run.py tests/test_experiment_run_materialization_binding.py > /tmp/calibration-red.txt 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "expected.agent_path must be a canonical V2 task path under /root" /tmp/calibration-red.txt
      - name: Apply calibration evidence split
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def unique_index(lines: list[str], predicate, label: str) -> int:
              matches = [index for index, line in enumerate(lines) if predicate(line)]
              if len(matches) != 1:
                  raise SystemExit(f"{label}: expected one match, found {len(matches)}")
              return matches[0]

          test_path = Path("tests/test_experiment_run.py")
          test_lines = test_path.read_text(encoding="utf-8").splitlines()

          start = unique_index(
              test_lines,
              lambda line: line.strip() == 'route.setdefault("expected_profile_path", str(profile))',
              "profile fixture start",
          )
          expected = [
              'route.setdefault("expected_profile_path", str(profile))',
              'route.setdefault("expected_profile_sha256", hashlib.sha256(profile.read_bytes()).hexdigest())',
              'if "profile_origin_verdict" not in route:',
              'route["observed"]["agent_path"] = str(profile)',
              'route.setdefault("profile_origin_verdict", "verified")',
          ]
          actual = [test_lines[start].strip(), test_lines[start + 1].strip(), test_lines[start + 2].strip(), test_lines[start + 3].strip(), test_lines[start + 4].strip()]
          if actual != expected:
              raise SystemExit(f"profile fixture shape drifted: {actual!r}")
          indent = test_lines[start][: len(test_lines[start]) - len(test_lines[start].lstrip())]
          test_lines[start : start + 5] = [
              indent + 'route.setdefault("expected_profile_path", str(profile))',
              indent + 'route.setdefault("expected_profile_sha256", hashlib.sha256(profile.read_bytes()).hexdigest())',
              indent + 'if route["observed"].get("agent_path") is None:',
              indent + '    route["observed"]["agent_path"] = f"/root/{route[\'materialized_agent_type\']}"',
              indent + 'route.setdefault("profile_origin_verdict", "verified")',
          ]

          test_start = unique_index(
              test_lines,
              lambda line: line.startswith("def test_calibration_profile_origin_requires_exact_owned_path_and_current_sha"),
              "profile-origin test start",
          )
          next_test = next(
              index
              for index in range(test_start + 1, len(test_lines))
              if test_lines[index].startswith("def test_calibration_provider_control_missing_or_different_is_ineligible")
          )
          replacement = [
              "def test_calibration_profile_origin_requires_exact_owned_path_and_current_sha(tmp_path: Path):",
              "    campaign = calibration_campaign()",
              "    run = calibration_run(campaign)",
              '    route = run["child_routes"][0]',
              '    route["observed"]["agent_path"] = "/root/different_task"',
              "    result = validate(tmp_path, campaign, run)",
              '    assert result["profile_origin_assurance"] == "verified"',
              '    assert route["observed"]["agent_path"] == "/root/different_task"',
              "",
              "    run = calibration_run(campaign)",
              "    validate(tmp_path, campaign, run)",
              '    Path(run["child_routes"][0]["expected_profile_path"]).write_text("drifted\\n")',
              '    run["child_routes"][0]["profile_origin_verdict"] = "failed"',
              '    run["profile_origin_assurance"] = "failed"',
              "    result = VALIDATOR.validate_run(run, write_campaign(tmp_path, campaign))",
              '    assert result["claim_eligible"] is False',
              "",
              "",
          ]
          test_lines[test_start:next_test] = replacement

          artifact_line = unique_index(
              test_lines,
              lambda line: 'artifact["local"] = {**artifact["native"], "agent_path": str(tmp_path / "other.toml")}' in line,
              "forged runtime agent_path",
          )
          test_lines[artifact_line] = test_lines[artifact_line].replace(
              'str(tmp_path / "other.toml")', '"/root/other_task"'
          )
          test_path.write_text("\n".join(test_lines) + "\n", encoding="utf-8")

          validator_path = Path("scripts/validate-experiment-run.py")
          validator_lines = validator_path.read_text(encoding="utf-8").splitlines()
          origin_start = unique_index(
              validator_lines,
              lambda line: line.strip() == 'observed_path = route["observed"]["agent_path"]',
              "profile-origin validator start",
          )
          origin_end = unique_index(
              validator_lines,
              lambda line: 'for observed agent_path and frozen profile SHA256' in line,
              "profile-origin validator end",
          )
          if origin_end < origin_start:
              raise SystemExit("profile-origin validator markers out of order")
          indent = validator_lines[origin_start][: len(validator_lines[origin_start]) - len(validator_lines[origin_start].lstrip())]
          validator_lines[origin_start : origin_end + 1] = [
              indent + 'expected_origin_verdict = "verified"',
              indent + "try:",
              indent + "    current_sha256 = hashlib.sha256(expected_path.read_bytes()).hexdigest()",
              indent + "except OSError:",
              indent + '    expected_origin_verdict = "failed"',
              indent + "else:",
              indent + "    if current_sha256 != expected_sha256:",
              indent + '        expected_origin_verdict = "failed"',
              indent + 'if route["profile_origin_verdict"] != expected_origin_verdict:',
              indent + "    fail(",
              indent + '        f"profile origin verdict must be {expected_origin_verdict!r} for the "',
              indent + '        "campaign-owned profile path and frozen profile SHA256"',
              indent + "    )",
          ]
          validator_path.write_text("\n".join(validator_lines) + "\n", encoding="utf-8")
          PY
      - name: Verify focused experiment semantics
        run: python -m pytest -q tests/test_experiment_run.py tests/test_experiment_run_materialization_binding.py
      - name: Verify full repository
        run: |
          python -m ruff check scripts tests --ignore E402
          python scripts/package_integrity.py --check-generated
          python scripts/package_integrity.py
          python -m pytest -q
          git diff --check
      - name: Commit repaired source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/validate-experiment-run.py tests/test_experiment_run.py
          git commit -m 'fix: separate calibration task path from profile origin'
          git push origin HEAD:fix/host-runtime-evidence-resolvers
