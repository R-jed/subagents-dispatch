name: fix-calibration-profile-origin

on:
  push:
    branches:
      - fix/host-runtime-evidence-resolvers

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Guard exact parent
        run: |
          test "$(git rev-parse HEAD^)" = "afc49e80aa102a33b0e541bdbdfecb0d3d0e2870"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/fix-calibration-profile-origin.yml"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Confirm regression remains red
        run: |
          if python -m pytest -q tests/test_experiment_run.py tests/test_experiment_run_materialization_binding.py; then
            echo "expected calibration regression to be red before implementation" >&2
            exit 1
          fi
      - name: Apply evidence split
        run: python -c "import base64; exec(base64.b64decode(''))"
      - name: Verify focused experiment semantics
        run: python -m pytest -q tests/test_experiment_run.py tests/test_experiment_run_materialization_binding.py
      - name: Verify full repository
        run: |
          python -m ruff check scripts tests --ignore E402
          python scripts/package_integrity.py --check-generated
          python scripts/package_integrity.py
          python -m pytest -q
          git diff --check
      - name: Self-delete and commit
        run: |
          rm .github/workflows/fix-calibration-profile-origin.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: separate calibration task path from profile origin"
          git push origin HEAD:fix/host-runtime-evidence-resolvers