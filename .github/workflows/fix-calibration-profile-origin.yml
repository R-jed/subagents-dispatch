name: fix-calibration-profile-origin

on:
  push:
    branches:
      - fix/host-runtime-evidence-resolvers

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Guard exact parent
        run: |
          test "$(git rev-parse HEAD^)" = "da10ece1d56e105dcf1d68c36a44db67d79290a9"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/fix-calibration-profile-origin.yml"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Confirm exact regression remains red
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_experiment_run.py tests/test_experiment_run_materialization_binding.py > /tmp/calibration-red.txt 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "expected.agent_path must be a canonical V2 task path under /root" /tmp/calibration-red.txt
      - name: Apply calibration evidence split
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_exact(path_text: str, old: str, new: str) -> None:
              path = Path(path_text)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path_text}: expected one match, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          replace_exact(
              "tests/test_experiment_run.py",
              '''        route.setdefault("expected_profile_path", str(profile))
          route.setdefault("expected_profile_sha256", hashlib.sha256(profile.read_bytes()).hexdigest())
          if "profile_origin_verdict" not in route:
              route["observed"]["agent_path"] = str(profile)
          route.setdefault("profile_origin_verdict", "verified")
          ''',
              '''        route.setdefault("expected_profile_path", str(profile))
          route.setdefault("expected_profile_sha256", hashlib.sha256(profile.read_bytes()).hexdigest())
          if route["observed"].get("agent_path") is None:
              route["observed"]["agent_path"] = f"/root/{route['materialized_agent_type']}"
          route.setdefault("profile_origin_verdict", "verified")
          ''',
          )

          replace_exact(
              "scripts/validate-experiment-run.py",
              '''    observed_path = route["observed"]["agent_path"]
          if observed_path is None:
              expected_origin_verdict = "unknown"
          else:
              observed = Path(observed_path)
              expected_origin_verdict = "verified" if observed.is_absolute() and observed.resolve() == expected_path.resolve() else "failed"
          if expected_origin_verdict == "verified":
              try:
                  current_sha256 = hashlib.sha256(expected_path.read_bytes()).hexdigest()
              except OSError:
                  expected_origin_verdict = "failed"
              else:
                  if current_sha256 != expected_sha256:
                      expected_origin_verdict = "failed"
          if route["profile_origin_verdict"] != expected_origin_verdict:
              fail(f"profile origin verdict must be {expected_origin_verdict!r} for observed agent_path and frozen profile SHA256")
          ''',
              '''    expected_origin_verdict = "verified"
          try:
              current_sha256 = hashlib.sha256(expected_path.read_bytes()).hexdigest()
          except OSError:
              expected_origin_verdict = "failed"
          else:
              if current_sha256 != expected_sha256:
                  expected_origin_verdict = "failed"
          if route["profile_origin_verdict"] != expected_origin_verdict:
              fail(
                  f"profile origin verdict must be {expected_origin_verdict!r} for the "
                  "campaign-owned profile path and frozen profile SHA256"
              )
          ''',
          )

          test_path = Path("tests/test_experiment_run.py")
          test_text = test_path.read_text(encoding="utf-8")
          start_marker = "def test_calibration_profile_origin_requires_exact_owned_path_and_current_sha(tmp_path: Path):\n"
          end_marker = "\ndef test_calibration_provider_control_missing_or_different_is_ineligible(tmp_path: Path):\n"
          if test_text.count(start_marker) != 1 or test_text.count(end_marker) != 1:
              raise SystemExit("calibration profile-origin test markers mismatch")
          start = test_text.index(start_marker)
          end = test_text.index(end_marker, start)
          replacement = '''def test_calibration_profile_origin_requires_exact_owned_path_and_current_sha(tmp_path: Path):
              campaign = calibration_campaign()
              run = calibration_run(campaign)
              route = run["child_routes"][0]
              route["observed"]["agent_path"] = "/root/different_task"
              result = validate(tmp_path, campaign, run)
              assert result["profile_origin_assurance"] == "verified"
              assert route["observed"]["agent_path"] == "/root/different_task"

              run = calibration_run(campaign)
              validate(tmp_path, campaign, run)
              Path(run["child_routes"][0]["expected_profile_path"]).write_text("drifted\\n")
              run["child_routes"][0]["profile_origin_verdict"] = "failed"
              run["profile_origin_assurance"] = "failed"
              result = VALIDATOR.validate_run(run, write_campaign(tmp_path, campaign))
              assert result["claim_eligible"] is False

          '''
          replacement = "\n".join(line[10:] if line.startswith("          ") else line for line in replacement.splitlines()) + "\n"
          test_path.write_text(test_text[:start] + replacement + test_text[end + 1 :], encoding="utf-8")

          replace_exact(
              "tests/test_experiment_run.py",
              'artifact["local"] = {**artifact["native"], "agent_path": str(tmp_path / "other.toml")}\n',
              'artifact["local"] = {**artifact["native"], "agent_path": "/root/other_task"}\n',
          )
          PY
      - name: Verify focused experiment semantics
        run: python -m pytest -q tests/test_experiment_run.py tests/test_experiment_run_materialization_binding.py
      - name: Verify full repository
        run: |
          python -m ruff check scripts tests --ignore E402
          python scripts/package_integrity.py --check-generated
          python scripts/package_integrity.py
          python -m pytest -q
          git diff --check
      - name: Commit repaired source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/validate-experiment-run.py tests/test_experiment_run.py
          git commit -m 'fix: separate calibration task path from profile origin'
          git push origin HEAD:fix/host-runtime-evidence-resolvers
