name: Fix qualification resolver large unrelated rollout

on:
  push:
    branches:
      - fix/qualification-resolver-large-unrelated-rollout

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/qualification-resolver-large-unrelated-rollout
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Add regression test
        shell: bash
        run: |
          cat > tests/test_host_qualification_resolver_large_rollout.py <<'PYTEST'
          from __future__ import annotations

          import json
          from pathlib import Path
          import subprocess
          import sys


          ROOT = Path(__file__).resolve().parents[1]
          EVIDENCE = ROOT / "scripts" / "host_qualification_evidence.py"
          ROOT_THREAD = "11111111-1111-7111-8111-111111111111"
          CHILD_THREAD = "22222222-2222-7222-8222-222222222222"
          OTHER_THREAD = "33333333-3333-7333-8333-333333333333"
          SESSION_ID = "aaaaaaaa-aaaa-7aaa-8aaa-aaaaaaaaaaaa"
          ROLE = "subagents_dispatch_reader"
          TASK_PATH = "/root/sd_host_canary_a1"
          MAX_ROLLOUT_BYTES = 64 * 1024 * 1024


          def write_rollout(
              sessions: Path,
              *,
              thread_id: str,
              timestamp: str,
              agent_path: str,
              day: str,
          ) -> Path:
              folder = sessions / day
              folder.mkdir(parents=True, exist_ok=True)
              path = folder / f"rollout-2026-08-26T00-00-00-{thread_id}.jsonl"
              records = [
                  {
                      "timestamp": timestamp,
                      "type": "session_meta",
                      "payload": {
                          "session_id": SESSION_ID,
                          "id": thread_id,
                          "parent_thread_id": ROOT_THREAD,
                          "agent_role": ROLE,
                          "agent_path": agent_path,
                          "cli_version": "0.150.0-alpha.8",
                      },
                  },
                  {
                      "timestamp": "2026-08-26T00:01:01Z",
                      "type": "turn_context",
                      "payload": {"model": "gpt-5.6-luna", "effort": "max"},
                  },
              ]
              path.write_text(
                  "\n".join(json.dumps(record) for record in records) + "\n",
                  encoding="utf-8",
              )
              return path


          def test_resolver_ignores_unrelated_rollout_over_exact_inspector_limit(tmp_path: Path):
              sessions = tmp_path / "sessions"
              unrelated = write_rollout(
                  sessions,
                  thread_id=OTHER_THREAD,
                  timestamp="2026-08-26T00:00:30Z",
                  agent_path="/root/unrelated",
                  day="2026/08/26",
              )
              with unrelated.open("r+b") as handle:
                  handle.seek(MAX_ROLLOUT_BYTES + 1)
                  handle.write(b"\n")

              write_rollout(
                  sessions,
                  thread_id=CHILD_THREAD,
                  timestamp="2026-08-26T00:01:00Z",
                  agent_path=TASK_PATH,
                  day="2026/08/27",
              )

              result = subprocess.run(
                  [
                      sys.executable,
                      str(EVIDENCE),
                      "--sessions-dir",
                      str(sessions),
                      "resolve-child",
                      "--agent-path",
                      TASK_PATH,
                      "--since",
                      "2026-08-26T00:00:00Z",
                      "--expected-parent-thread-id",
                      ROOT_THREAD,
                      "--expected-agent-role",
                      ROLE,
                  ],
                  cwd=ROOT,
                  text=True,
                  capture_output=True,
                  check=False,
              )

              assert result.returncode == 0, result.stderr
              assert json.loads(result.stdout)["thread_id"] == CHILD_THREAD
          PYTEST

      - name: Prove regression test is red before fix
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_host_qualification_resolver_large_rollout.py
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Regression test unexpectedly passed before the fix"
            exit 1
          fi

      - name: Apply resolver scope fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/host_qualification_evidence.py")
          text = path.read_text(encoding="utf-8")

          old_import = "from pathlib import Path\nimport re\nimport sys\n"
          new_import = "from pathlib import Path\nimport re\nimport stat\nimport sys\n"
          if text.count(old_import) != 1:
              raise SystemExit("expected import anchor exactly once")
          text = text.replace(old_import, new_import, 1)

          anchor = '''def session_meta_records(path: Path) -> list[tuple[dict[str, Any], dict[str, Any]]]:\n    \"\"\"Read only session_meta candidates while scanning unrelated rollouts.\n'''
          helper = '''def discovery_session_meta_record(\n    path: Path,\n) -> tuple[dict[str, Any], dict[str, Any]] | None:\n    \"\"\"Read only the first Host session_meta record for candidate discovery.\n\n    Discovery must not apply the exact-rollout total-size limit to unrelated historical\n    transcripts. The Host rollout format places session_meta first; only that bounded\n    first record is needed to decide whether a file can match the requested task path.\n    Relevant matches are still re-read through the strict exact-rollout path below.\n    \"\"\"\n\n    try:\n        expected = os.lstat(path)\n    except OSError as exc:\n        fail(f\"rollout is unavailable during session_meta discovery: {exc}\")\n    if not stat.S_ISREG(expected.st_mode):\n        fail(\"rollout candidate is not a regular file during session_meta discovery\")\n\n    flags = os.O_RDONLY | getattr(os, \"O_BINARY\", 0) | getattr(os, \"O_NOFOLLOW\", 0)\n    try:\n        fd = os.open(path, flags)\n    except OSError as exc:\n        fail(f\"could not open rollout during session_meta discovery: {exc}\")\n\n    try:\n        opened = os.fstat(fd)\n        if (\n            not stat.S_ISREG(opened.st_mode)\n            or (opened.st_dev, opened.st_ino) != (expected.st_dev, expected.st_ino)\n        ):\n            fail(\"rollout identity drifted during session_meta discovery\")\n\n        pending = bytearray()\n        raw_line: bytes | None = None\n        read_size = max(\n            1,\n            min(INSPECTOR.READ_CHUNK_BYTES, INSPECTOR.MAX_ROLLOUT_LINE_BYTES + 1),\n        )\n        while len(pending) <= INSPECTOR.MAX_ROLLOUT_LINE_BYTES:\n            chunk = os.read(fd, read_size)\n            if not chunk:\n                break\n            pending.extend(chunk)\n            boundary = INSPECTOR.NEWLINE_BOUNDARY.search(pending)\n            if boundary is not None:\n                raw_line = bytes(pending[: boundary.end()])\n                break\n            if len(pending) > INSPECTOR.MAX_ROLLOUT_LINE_BYTES:\n                return None\n\n        if raw_line is None:\n            if not pending or len(pending) > INSPECTOR.MAX_ROLLOUT_LINE_BYTES:\n                return None\n            raw_line = bytes(pending)\n\n        try:\n            line = raw_line.decode(\"utf-8\")\n        except UnicodeDecodeError:\n            return None\n        if not SESSION_META_LINE.search(line):\n            return None\n        try:\n            record = json.loads(line)\n        except json.JSONDecodeError:\n            return None\n        if not isinstance(record, dict) or record.get(\"type\") != \"session_meta\":\n            return None\n        payload = INSPECTOR.payload_object(record, 1)\n\n        closed = os.fstat(fd)\n        try:\n            current = os.lstat(path)\n        except OSError as exc:\n            fail(f\"rollout changed during session_meta discovery: {exc}\")\n        if (\n            not stat.S_ISREG(current.st_mode)\n            or (closed.st_dev, closed.st_ino) != (opened.st_dev, opened.st_ino)\n            or (current.st_dev, current.st_ino) != (opened.st_dev, opened.st_ino)\n        ):\n            fail(\"rollout identity drifted during session_meta discovery\")\n        return record, payload\n    finally:\n        os.close(fd)\n\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit("expected session_meta_records anchor exactly once")
          text = text.replace(anchor, helper + anchor, 1)

          old_loop = '''    matches: list[dict[str, Any]] = []\n    for rollout in rollout_files(sessions_dir):\n        sessions = session_meta_records(rollout)\n        if not sessions:\n            continue\n        relevant = [\n            (record, payload)\n            for record, payload in sessions\n            if INSPECTOR.optional_text(payload.get(\"agent_path\")) == path_value\n        ]\n        if not relevant:\n            continue\n        if len(sessions) != 1 or len(relevant) != 1:\n            fail(\"matching agent path appears in ambiguous session metadata\")\n        record, payload = relevant[0]\n'''
          new_loop = '''    matches: list[dict[str, Any]] = []\n    for rollout in rollout_files(sessions_dir):\n        discovered = discovery_session_meta_record(rollout)\n        if discovered is None:\n            continue\n        _, discovered_payload = discovered\n        if INSPECTOR.optional_text(discovered_payload.get(\"agent_path\")) != path_value:\n            continue\n\n        sessions = session_meta_records(rollout)\n        relevant = [\n            (record, payload)\n            for record, payload in sessions\n            if INSPECTOR.optional_text(payload.get(\"agent_path\")) == path_value\n        ]\n        if len(sessions) != 1 or len(relevant) != 1:\n            fail(\"matching agent path appears in ambiguous session metadata\")\n        record, payload = relevant[0]\n'''
          if text.count(old_loop) != 1:
              raise SystemExit("expected resolve-child loop anchor exactly once")
          text = text.replace(old_loop, new_loop, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify focused and full repository tests
        shell: bash
        run: |
          python -m pytest -q tests/test_host_qualification_resolver_large_rollout.py
          python -m pytest -q tests/test_host_qualification_evidence.py
          python -m ruff check scripts tests --ignore E402
          python scripts/package_integrity.py --check-generated
          python scripts/package_integrity.py
          python -m pytest -q

      - name: Commit verified source and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/fix-qualification-resolver-large-unrelated.yml
          git config user.name "R-jed"
          git config user.email "142428709+R-jed@users.noreply.github.com"
          git add scripts/host_qualification_evidence.py tests/test_host_qualification_resolver_large_rollout.py .github/workflows/fix-qualification-resolver-large-unrelated.yml
          git diff --cached --check
          git commit -m "fix: scope Host child resolver to relevant rollouts"
          git push origin HEAD:fix/qualification-resolver-large-unrelated-rollout
