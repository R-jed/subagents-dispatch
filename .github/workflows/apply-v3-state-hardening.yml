name: apply-v3-state-hardening

on:
  push:
    branches:
      - enhance/v3-control-surface-architecture
    paths:
      - .github/workflows/apply-v3-state-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - name: Apply exact state hardening patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/dispatch_state.py")
          text = path.read_text(encoding="utf-8")

          old_failure = '''            record["failure_origin"] = (
                child.get("failure_origin", "tool_failure") if mapped == "FAILED" else "none"
            )
            if mapped != "FAILED":
                record["blocker"] = "none"
'''
          new_failure = '''            if mapped == "FAILED":
                failure_origin = child.get("failure_origin", "tool_failure")
                record["failure_origin"] = (
                    failure_origin
                    if failure_origin in FAILURE_ORIGINS - {"none", "runtime_ambiguous"}
                    else "tool_failure"
                )
                record["blocker"] = "none"
            else:
                record["failure_origin"] = "none"
                record["blocker"] = "none"
'''
          if text.count(old_failure) != 1:
              raise SystemExit("expected reconcile failure-origin block exactly once")
          text = text.replace(old_failure, new_failure, 1)

          old_remove = '''    identity = resolve_thread_id(thread_id)
    with state_lock(identity, temp_root=temp_root):
        _, _, path, _ = _paths(identity, temp_root, create=True)
        if not path.exists():
            return False
'''
          new_remove = '''    identity = resolve_thread_id(thread_id)
    _, _, existing_path, _ = _paths(identity, temp_root, create=False)
    if not existing_path.exists():
        return False
    with state_lock(identity, temp_root=temp_root):
        _, _, path, _ = _paths(identity, temp_root, create=False)
        if not path.exists():
            return False
'''
          if text.count(old_remove) != 1:
              raise SystemExit("expected remove_state preflight block exactly once")
          text = text.replace(old_remove, new_remove, 1)

          path.write_text(text, encoding="utf-8")
          PY
          python -m py_compile scripts/dispatch_state.py
          git diff --check
      - name: Commit state hardening and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "R-jed"
          git config user.email "142428709+R-jed@users.noreply.github.com"
          git rm .github/workflows/apply-v3-state-hardening.yml
          git add scripts/dispatch_state.py
          git commit -m "fix: harden state reconciliation and cleanup preflight"
          git push origin HEAD:enhance/v3-control-surface-architecture
