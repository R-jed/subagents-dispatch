name: apply-v3-release-route-gate

on:
  push:
    branches:
      - enhance/v3-control-surface-architecture
    paths:
      - .github/workflows/apply-v3-release-route-gate.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Apply and validate release gate patch
        run: |
          python scripts/_apply_release_route_gate.py
          git diff --check
      - name: Commit patched candidate
        run: |
          git config user.name "R-jed"
          git config user.email "142428709+R-jed@users.noreply.github.com"
          git rm scripts/_apply_release_route_gate.py .github/workflows/apply-v3-release-route-gate.yml
          git add docs/release-checklist.md
          git commit -m "docs: require five-role live route release gate"
          git push origin HEAD:enhance/v3-control-surface-architecture
