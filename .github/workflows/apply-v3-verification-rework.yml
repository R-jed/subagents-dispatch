name: apply-v3-verification-rework

on:
  push:
    branches:
      - enhance/v3-control-surface-architecture
    paths:
      - .github/workflows/apply-v3-verification-rework.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Apply and validate verification rework patch
        run: |
          python scripts/_apply_verification_rework.py
          python -m py_compile scripts/dispatch_state.py
          python -m pip install -r requirements-dev.txt
          python -m pytest -q tests/test_dispatch_state.py tests/test_receipt_verification_rework.py
          python -m ruff check scripts/dispatch_state.py tests/test_receipt_verification_rework.py
          git diff --check
      - name: Commit patched candidate
        run: |
          git config user.name "R-jed"
          git config user.email "142428709+R-jed@users.noreply.github.com"
          git rm scripts/_apply_verification_rework.py .github/workflows/apply-v3-verification-rework.yml
          git add scripts/dispatch_state.py contracts/receipt.md tests/test_receipt_verification_rework.py
          git commit -m "feat: bind rework to deterministic verification gaps"
          git push origin HEAD:enhance/v3-control-surface-architecture
