name: policy-tests

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  OPENAI_CODEX_PLUGIN_VALIDATOR_REF: 7750465934d97dd3cbcb3b1655d2f622744010d3

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate plugin manifests
        shell: bash
        run: |
          python -m json.tool .codex-plugin/plugin.json >/dev/null
          python -m json.tool .agents/plugins/marketplace.json >/dev/null
      - name: Validate Plugin with pinned official OpenAI validator
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.11' }}
        shell: bash
        run: |
          validator="$RUNNER_TEMP/openai-validate-plugin.py"
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/openai/codex/${OPENAI_CODEX_PLUGIN_VALIDATOR_REF}/codex-rs/skills/src/assets/samples/plugin-creator/scripts/validate_plugin.py" \
            --output "$validator"
          python "$validator" .
      - name: Lint Python
        run: python -m ruff check scripts tests --ignore E402
      - name: Run full test suite
        run: python -m pytest -q
      - name: Verify managed Agent profile lifecycle
        shell: bash
        run: |
          target="$RUNNER_TEMP/subagents-dispatch-companion"
          python scripts/install-agents.py --codex-home "$target"
          python scripts/install-agents.py --codex-home "$target" --check
          python scripts/doctor.py --codex-home "$target" --check
          python scripts/install-agents.py --codex-home "$target"

  policy-tests:
    name: policy-tests
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all platform checks
        shell: bash
        run: test '${{ needs.test.result }}' = 'success'
