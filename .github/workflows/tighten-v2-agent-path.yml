name: tighten-v2-agent-path
on:
  push:
    branches: [fix/host-runtime-evidence-resolvers]
permissions:
  contents: write
jobs:
  tighten:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {fetch-depth: 2}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with: {python-version: '3.11'}
      - name: Guard exact parent
        run: |
          test "$(git rev-parse HEAD^)" = "6b8f11a87636ab9b64f5d1a0802b70fa612978e2"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/tighten-v2-agent-path.yml"
      - run: python -m pip install -r requirements-dev.txt
      - name: Add stricter upstream AgentPath tests first
        shell: python
        run: |
          from pathlib import Path
          p = Path('tests/test_runtime_attestation.py')
          s = p.read_text(encoding='utf-8')
          marker = 'def test_runtime_evidence_accepts_nested_canonical_v2_task_path():\n'
          if s.count(marker) != 1:
              raise SystemExit('nested path test marker mismatch')
          insert = '''@pytest.mark.parametrize(
              "task_path",
              [
                  "/root/BadName",
                  "/root/bad-name",
                  "/root/bad.name",
                  "/root/root",
                  "/root/parent/root",
              ],
          )
          def test_runtime_evidence_rejects_noncanonical_v2_agent_path_segments(task_path: str):
              payload = {
                  "expected": {
                      "agent_role": ROLE,
                      "model": "gpt-5.6-luna",
                      "effort": "max",
                      "agent_path": task_path,
                  },
                  "local": {
                      "agent_role": ROLE,
                      "model": "gpt-5.6-luna",
                      "effort": "max",
                      "agent_path": task_path,
                  },
              }
              result = subprocess.run(
                  [sys.executable, str(EVIDENCE)], cwd=ROOT, input=json.dumps(payload),
                  text=True, capture_output=True, check=False,
              )
              assert result.returncode != 0
              assert "canonical V2 task path" in result.stderr


          '''
          insert = '\n'.join(line[10:] if line.startswith('          ') else line for line in insert.splitlines()) + '\n'
          p.write_text(s.replace(marker, insert + marker), encoding='utf-8')
      - name: Prove stricter tests red
        shell: bash
        run: |
          if python -m pytest -q tests/test_runtime_attestation.py -k noncanonical_v2_agent_path_segments; then
            echo 'expected noncanonical AgentPath tests to fail before implementation' >&2
            exit 1
          fi
      - name: Align validator to upstream AgentPath
        shell: python
        run: |
          from pathlib import Path
          p = Path('scripts/runtime-evidence.py')
          s = p.read_text(encoding='utf-8')
          old = 'V2_AGENT_PATH = re.compile(r"^/root(?:/[A-Za-z0-9_][A-Za-z0-9._-]*)+$")\n'
          new = 'V2_AGENT_PATH = re.compile(r"^/root(?:/(?!root(?:/|$))[a-z0-9_]+)+$")\n'
          if s.count(old) != 1:
              raise SystemExit('V2_AGENT_PATH pattern mismatch')
          p.write_text(s.replace(old, new), encoding='utf-8')

          p = Path('docs/codex-v2-source-alignment.md')
          s = p.read_text(encoding='utf-8')
          needle = 'Implication for this repository: Host-produced `session_meta.agent_path` must be interpreted as the native task-path identity when it has the V2 canonical `/root/...` form. It must not be used as managed profile-file provenance.\n'
          replacement = needle + '\n`AgentPath::validate_agent_name` further constrains every non-root segment to lowercase ASCII letters, digits, and underscores, rejects the reserved segment `root`, and rejects `.` / `..` or embedded `/`. Runtime validation in this repository mirrors those canonical segment rules.\n'
          if s.count(needle) != 1:
              raise SystemExit('source-alignment implication marker mismatch')
          p.write_text(s.replace(needle, replacement), encoding='utf-8')
      - name: Verify and regenerate package integrity
        run: |
          python -m pytest -q tests/test_runtime_attestation.py
          python -m ruff check scripts/runtime-evidence.py tests/test_runtime_attestation.py --ignore E402
          python scripts/package_integrity.py --write
          python scripts/package_integrity.py --check-generated
          python scripts/package_integrity.py
          git diff --check
      - name: Self-delete and commit
        run: |
          rm .github/workflows/tighten-v2-agent-path.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: match Codex V2 AgentPath segment rules'
          git push origin HEAD:fix/host-runtime-evidence-resolvers
