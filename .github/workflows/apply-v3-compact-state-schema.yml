name: apply-v3-compact-state-schema

on:
  push:
    branches:
      - enhance/v3-control-surface-architecture
    paths:
      - .github/workflows/apply-v3-compact-state-schema.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Apply and validate compact-state patch
        run: |
          python scripts/_apply_compact_state_schema.py
          python scripts/_adjust_compact_state_tests.py
          python -m py_compile scripts/dispatch_state.py
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
          python -m ruff check scripts tests --ignore E402
          git diff --check
      - name: Commit patched candidate
        run: |
          git config user.name "R-jed"
          git config user.email "142428709+R-jed@users.noreply.github.com"
          git rm scripts/_apply_compact_state_schema.py scripts/_adjust_compact_state_tests.py .github/workflows/apply-v3-compact-state-schema.yml
          git add scripts/dispatch_state.py contracts/state.md tests/test_dispatch_state.py tests/test_dispatch_state_compact_schema.py tests/test_doctor.py tests/test_v3_runtime_hardening.py
          git commit -m "fix: close ephemeral state schema and receipt recovery channel"
          git push origin HEAD:enhance/v3-control-surface-architecture
