name: rc4-fixture-migrate

on:
  push:
    branches:
      - v4/rc4-host-contract-closure

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: v4/rc4-host-contract-closure
          fetch-depth: 0
      - name: Migrate RC2 RC3 fixtures to RC4 Host contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected block in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Writer lifecycle tests must use the actual V2 FunctionToolOutput text body.
          replace_once(
              'tests/test_writer_lease_lifecycle_v4.py',
              'import importlib.util\nfrom pathlib import Path',
              'import importlib.util\nimport json\nfrom pathlib import Path',
          )
          replace_once(
              'tests/test_writer_lease_lifecycle_v4.py',
              '''        "tool_response": [\n            {\n                "agent_name": f"/root/{execution['native_task_name']}",\n                "status": _host_status(host_state),\n            }\n        ],''',
              '''        "tool_response": json.dumps(\n            {\n                "agents": [\n                    {\n                        "agent_name": f"/root/{execution['native_task_name']}",\n                        "agent_status": _host_status(host_state),\n                    }\n                ]\n            },\n            separators=(",", ":"),\n        ),''',
          )
          replace_once(
              'tests/test_writer_lease_lifecycle_v4.py',
              '''        "tool_response": [\n            {"agent_name": f"/root/{execution['native_task_name']}", "status": "interrupted"}\n        ],''',
              '''        "tool_response": json.dumps(\n            {\n                "agents": [\n                    {\n                        "agent_name": f"/root/{execution['native_task_name']}",\n                        "agent_status": "interrupted",\n                    }\n                ]\n            },\n            separators=(",", ":"),\n        ),''',
          )

          # RC2 scheduler fixtures now carry a complete normalized Host capability snapshot.
          replace_once(
              'tests/test_v4_rc2_adversarial_remediation.py',
              '''def host_snapshot(capacity: int) -> dict:\n    return {\n        "execution_ready": True,\n        "missing": [],\n        "max_spawned_threads": capacity,\n    }\n''',
              '''def host_snapshot(capacity: int) -> dict:\n    return {\n        "surface": "multi_agent_v2",\n        "capabilities": {\n            "spawn": True,\n            "observe": True,\n            "wait_or_wakeup": True,\n            "followup": True,\n            "interrupt": True,\n            "pre_tool_use_guard": True,\n            "post_tool_use_guard": True,\n            "host_observation_guard": True,\n            "subagent_stop_veto": True,\n        },\n        "fork_turns_none": True,\n        "max_spawned_threads": capacity,\n        "capacity_excludes_primary": True,\n        "execution_ready": True,\n        "missing": [],\n    }\n''',
          )
          replace_once(
              'tests/test_v4_rc2_adversarial_remediation.py',
              '''    state.validate_state_payload(payload)\n\n    occupied = scheduler.scheduler_decision(\n        payload,\n        capability_snapshot=host_snapshot(2),\n        wakeup_reason="AGENT_COMPLETED",\n    )\n    assert occupied["occupied_open_threads"] == 1\n    assert occupied["launch_budget"] == 1\n    assert len(occupied["actions"]) == 1\n\n    payload["executions"][0]["lifecycle"] = "CLOSED"\n    state.validate_state_payload(payload)\n    released = scheduler.scheduler_decision(\n        payload,\n        capability_snapshot=host_snapshot(2),\n        wakeup_reason="CAPACITY_RELEASED",\n    )\n    assert released["occupied_open_threads"] == 0\n    assert released["launch_budget"] == 2\n    assert len(released["actions"]) == 2\n''',
              '''    payload["accounting_refs"] = [\n        {\n            "ref": "host-capacity-observation:rc2-completed",\n            "kind": "host_capacity_observation",\n            "source": "post_tool_use:list_agents",\n            "turn_id": "turn-capacity-completed",\n            "tool_use_id": "tool-capacity-completed",\n            "resident_children": 1,\n            "settled_children": 1,\n            "active_children": 0,\n            "managed_resident_children": 1,\n            "unmanaged_resident_children": 0,\n            "response_digest": "a" * 64,\n        }\n    ]\n    state.validate_state_payload(payload)\n\n    occupied = scheduler.scheduler_decision(\n        payload,\n        capability_snapshot=host_snapshot(2),\n        wakeup_reason="AGENT_COMPLETED",\n    )\n    assert occupied["occupied_host_residents"] == 1\n    assert occupied["launch_budget"] == 1\n    assert len(occupied["actions"]) == 1\n\n    payload["executions"][0]["lifecycle"] = "CLOSED"\n    observation = payload["accounting_refs"][0]\n    observation["resident_children"] = 0\n    observation["settled_children"] = 0\n    observation["managed_resident_children"] = 0\n    state.validate_state_payload(payload)\n    released = scheduler.scheduler_decision(\n        payload,\n        capability_snapshot=host_snapshot(2),\n        wakeup_reason="CAPACITY_RELEASED",\n    )\n    assert released["occupied_host_residents"] == 0\n    assert released["launch_budget"] == 1\n    assert len(released["actions"]) == 1\n''',
          )
          replace_once(
              'tests/test_v4_rc2_adversarial_remediation.py',
              '''        "tool_response": [\n            {"agent_name": "/root/sd_u1_a1", "status": "running"}\n        ],''',
              '''        "tool_response": json.dumps(\n            {"agents": [{"agent_name": "/root/sd_u1_a1", "agent_status": "running"}]},\n            separators=(",", ":"),\n        ),''',
          )
          replace_once(
              'tests/test_v4_rc2_adversarial_remediation.py',
              '''    assert set(probes) == {f"H{number:02d}" for number in range(11)}\n    assert "exact active lifecycle Hook definition hash captured" in probes["H00"]["requires"]\n    assert any("canonical digests match" in item for item in probes["H08"]["requires"])\n    assert any("closing the child releases capacity" in item for item in probes["H09"]["requires"])\n    assert any("WriterLease is HELD" in item for item in probes["H10"]["requires"])''',
              '''    assert set(probes) == {f"H{number:02d}" for number in range(21)}\n    assert "exact active lifecycle Hook digest" in probes["H00"]["requires"]\n    assert any("canonical authorized payload" in item for item in probes["H08"]["requires"])\n    assert any("settled-resident reclaim" in item for item in probes["H09"]["requires"])\n    assert any("WriterLease transition" in item for item in probes["H10"]["requires"])\n    assert probes["H18"]["operation"] == "mixed managed unmanaged Host occupancy"\n    assert probes["H20"]["platform"] == "windows"''',
          )

          # RC3 snapshot gains the RC4 observation-guard capability.
          replace_once(
              'tests/test_v4_rc3_red_contracts.py',
              '''            "post_tool_use_guard": True,\n            "subagent_stop_veto": True,''',
              '''            "post_tool_use_guard": True,\n            "host_observation_guard": True,\n            "subagent_stop_veto": True,''',
          )

          # Product/release tests now bind the H00-H20 static campaign contract.
          replace_once(
              'tests/test_product_surface.py',
              'assert smoke["gate_id"] == "phase8-real-host-lifecycle-coverage"',
              'assert smoke["gate_id"] == "v4-real-host-h00-h20"',
          )
          replace_once(
              'tests/test_release_contracts.py',
              '''    assert smoke["blocks_release"] == "v4.0.0-production-hook-activation-and-publication"\n    assert {probe["id"] for probe in smoke["required_probes"]} == {\n        f"H{number:02d}" for number in range(11)\n    }''',
              '''    assert smoke["gate_id"] == "v4-real-host-h00-h20"\n    assert smoke["results"] == {}\n    assert {probe["id"] for probe in smoke["required_probes"]} == {\n        f"H{number:02d}" for number in range(21)\n    }''',
          )
          replace_once(
              'tests/test_release_contracts.py',
              'assert "Only after H00-H10 pass may the staged `docs/v4/hooks.json` be promoted" in RELEASE.read_text(encoding="utf-8")',
              'assert "Only after H00-H20 pass may the staged `docs/v4/hooks.json` be promoted" in RELEASE.read_text(encoding="utf-8")',
          )

          # The state facade intentionally delegates storage/schema machinery to its core.
          replace_once(
              'tests/test_v4_terminology_cleanup.py',
              'assert "This module owns the V4 schema" in state',
              'assert "V4 state facade with RC3/RC4 correctness-bearing truth" in state',
          )

          # Rewrite old Host-smoke baseline tests around the current external-evidence boundary.
          Path('tests/test_v4_baseline_and_host_gate.py').write_text('''from __future__ import annotations\n\nimport json\nfrom pathlib import Path\n\n\nROOT = Path(__file__).resolve().parents[1]\nV4 = ROOT / "docs" / "v4"\n\n\ndef load_json(name: str) -> dict:\n    return json.loads((V4 / name).read_text(encoding="utf-8"))\n\n\ndef test_v4_engineering_baseline_is_hardened_main_not_bare_v3_0_0():\n    baseline = load_json("engineering-baseline.json")\n\n    assert baseline["family"] == "V3.x Hardened Baseline"\n    assert baseline["branch"] == "main"\n    assert baseline["commit"] == "1252c366756b1f981c845f7664da14c0f81eac20"\n    assert baseline["release_lineage"] == {\n        "v3.0.0": "f90105f4a9f0ecdf94c8306095d80a92ab995370",\n        "v3.0.1": "bfc4e249ba1acc75876dab1b43cedb9f321ee829",\n    }\n    assert "state-protocol family" in baseline["migration_note"]\n    assert baseline["phase0_guard_evidence"] == {\n        "baseline_spawn_guard_failure_exit_code": 78,\n        "codex_pre_tool_use_blocking_exit_code": 2,\n        "phase0_fix_required": True,\n    }\n\n\ndef test_tracked_host_contract_cannot_self_attest_runtime_pass():\n    smoke = load_json("host-smoke.json")\n\n    assert smoke["schema_version"] == "4.0.0-host-smoke-7"\n    assert smoke["gate_id"] == "v4-real-host-h00-h20"\n    assert smoke["status"] == "PENDING"\n    assert smoke["results"] == {}\n    assert "external exact-candidate campaign" in smoke["pass_policy"]\n\n\ndef test_real_host_smoke_gate_covers_all_managed_lifecycle_boundaries():\n    smoke = load_json("host-smoke.json")\n    probes = {probe["id"]: probe for probe in smoke["required_probes"]}\n\n    assert set(probes) == {f"H{number:02d}" for number in range(21)}\n    assert probes["H00"]["operation"] == "Hook trust and activation"\n    assert probes["H01"]["operation"] == "spawn_agent Pre/Post"\n    assert probes["H02"]["operation"] == "followup_task Pre/Post"\n    assert probes["H03"]["operation"] == "interrupt_agent Pre/Post"\n    assert probes["H04"]["operation"] == "SubagentStop veto"\n    assert probes["H09"]["operation"] == "V2 residency capacity and refill"\n    assert probes["H18"]["operation"] == "mixed managed unmanaged Host occupancy"\n    assert probes["H19"]["operation"] == "candidate-bound Host evidence"\n    assert probes["H20"]["operation"] == "Windows effective path aliases"\n    assert probes["H20"]["platform"] == "windows"\n    assert smoke["required_environment_fields"] == [\n        "architecture",\n        "codex_version",\n        "host_build",\n        "platform",\n        "run_id",\n    ]\n    assert smoke["required_result_fields"] == ["environment_id", "evidence_ref", "status"]\n\n\ndef test_offline_development_can_advance_while_supported_release_stays_blocked():\n    status = load_json("phase-status.json")\n    smoke = load_json("host-smoke.json")\n\n    assert status["phases"]["phase0"]["status"] == "PASS"\n    assert status["phases"]["phase1"]["status"] == "PASS"\n    assert status["phases"]["phase2"]["status"] == "PASS"\n    assert status["phases"]["phase3"]["repository_implementation"] == "PASS"\n    assert status["phases"]["phase3"]["offline_verification"] == "PASS"\n    assert status["phases"]["phase3"]["real_host_smoke"] == "PENDING_RELEASE_GATE"\n    assert smoke["status"] == "PENDING"\n    assert smoke["results"] == {}\n    assert status["phases"]["phase4"]["status"] == "PASS"\n    assert "publication remain blocked" in status["release_rule"]\n''', encoding='utf-8')

          # Doctor Host-gate tests now prove tracked static contract cannot manufacture PASS.
          Path('tests/test_v4_rc2_doctor_host_gate.py').write_text('''from __future__ import annotations\n\nimport importlib.util\nimport json\nfrom pathlib import Path\nimport sys\n\n\nROOT = Path(__file__).resolve().parents[1]\nSCRIPTS = ROOT / "scripts"\nHOST_SMOKE = ROOT / "docs" / "v4" / "host-smoke.json"\n\n\ndef load_module(name: str, filename: str):\n    scripts = str(SCRIPTS)\n    sys.path.insert(0, scripts)\n    try:\n        spec = importlib.util.spec_from_file_location(name, SCRIPTS / filename)\n        assert spec and spec.loader\n        module = importlib.util.module_from_spec(spec)\n        sys.modules[name] = module\n        spec.loader.exec_module(module)\n        return module\n    finally:\n        sys.path.remove(scripts)\n\n\ndef write_json(path: Path, payload: dict) -> None:\n    path.write_text(json.dumps(payload), encoding="utf-8")\n\n\ndef tracked_contract() -> dict:\n    return json.loads(HOST_SMOKE.read_text(encoding="utf-8"))\n\n\ndef bind_files(module, tmp_path: Path, *, smoke: dict, production_events: list[str]) -> None:\n    smoke_path = tmp_path / "host-smoke.json"\n    production_path = tmp_path / "hooks.json"\n    staged_path = tmp_path / "staged-hooks.json"\n    write_json(smoke_path, smoke)\n    write_json(production_path, {"hooks": {event: [] for event in production_events}})\n    write_json(\n        staged_path,\n        {"hooks": {event: [] for event in ("PreToolUse", "PostToolUse", "SubagentStop")}},\n    )\n    module.HOST_SMOKE = smoke_path\n    module.HOOKS = production_path\n    module.STAGED_HOOKS = staged_path\n\n\ndef test_tracked_top_level_pass_is_rejected_even_without_embedded_results(tmp_path: Path):\n    doctor = load_module("rc4_doctor_spoof", "doctor_runtime.py")\n    smoke = tracked_contract()\n    smoke["status"] = "PASS"\n    bind_files(\n        doctor,\n        tmp_path,\n        smoke=smoke,\n        production_events=["PreToolUse", "PostToolUse", "SubagentStop"],\n    )\n\n    hook, release = doctor.diagnose_hook_and_release()\n    assert hook["status"] == "FAIL"\n    assert "tracked Host-smoke contract must remain PENDING" in hook["summary"]\n    assert release["details"]["release_ready"] is False\n\n\ndef test_complete_production_hooks_cannot_close_gate_without_external_campaign(tmp_path: Path):\n    doctor = load_module("rc4_doctor_external_boundary", "doctor_runtime.py")\n    bind_files(\n        doctor,\n        tmp_path,\n        smoke=tracked_contract(),\n        production_events=["PreToolUse", "PostToolUse", "SubagentStop"],\n    )\n\n    hook, release = doctor.diagnose_hook_and_release()\n    assert hook["status"] == "UNKNOWN"\n    assert hook["details"]["smoke_complete"] is False\n    assert release["status"] == "UNKNOWN"\n    assert release["details"]["release_ready"] is False\n\n\ndef test_pending_empty_results_remains_valid_but_release_blocked(tmp_path: Path):\n    doctor = load_module("rc4_doctor_pending", "doctor_runtime.py")\n    bind_files(\n        doctor,\n        tmp_path,\n        smoke=tracked_contract(),\n        production_events=["PreToolUse"],\n    )\n\n    hook, release = doctor.diagnose_hook_and_release()\n    assert hook["status"] == "UNKNOWN"\n    assert hook["details"]["smoke_complete"] is False\n    assert release["details"]["release_ready"] is False\n''', encoding='utf-8')
          PY
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          if git diff --cached --quiet; then
            echo "No fixture migration changes needed"
            exit 0
          fi
          git commit -m "test(v4): migrate historical fixtures to RC4 Host contract"
          git push origin HEAD:v4/rc4-host-contract-closure
