name: apply-v2-runtime-evidence-fix

on:
  push:
    branches:
      - fix/host-runtime-evidence-resolvers

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Verify exact starting point
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "18f22cc2faf0922c4f34da9782667de8c83171af"
          changed="$(git diff --name-only HEAD^ HEAD)"
          test "$changed" = ".github/workflows/apply-v2-runtime-evidence-fix.yml"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Add regression tests first
        shell: python
        run: |
          from pathlib import Path

          path = Path('tests/test_runtime_attestation.py')
          text = path.read_text(encoding='utf-8')
          old = '''def test_runtime_evidence_reports_exact_profile_origin_and_provider_control(tmp_path: Path):
              profile = tmp_path / "owned.toml"
              profile.write_text("owned\\n")
              sessions = tmp_path / "sessions"
              write_rollout(sessions, agent_path=str(profile))
              payload = {
                  "expected": {
                      "agent_role": ROLE, "model": "gpt-5.6-luna", "effort": "max",
                      "agent_path": str(profile), "model_provider": "openai",
                  },
                  "native": {"agent_role": ROLE, "model": "gpt-5.6-luna", "effort": "max"},
                  "rollout": {"thread_id": THREAD, "sessions_dir": str(sessions)},
              }
              result = subprocess.run(
                  [sys.executable, str(EVIDENCE)], cwd=ROOT, input=json.dumps(payload),
                  text=True, capture_output=True, check=False,
              )
              assert result.returncode == 0, result.stderr
              output = json.loads(result.stdout)
              assert output["profile_origin_observation"]["status"] == "verified"
              assert output["provider_control_assurance"]["status"] == "verified"
              assert output["truth_layers"]["observed_auxiliary"]["fields"]["agent_path"] == str(profile)


          @pytest.mark.parametrize("field", ["agent_path", "model_provider"])
          def test_runtime_evidence_fails_closed_on_public_rollout_origin_or_provider_conflict(
              tmp_path: Path, field: str
          ):
              profile = tmp_path / "owned.toml"
              profile.write_text("owned\\n")
              sessions = tmp_path / "sessions"
              write_rollout(sessions, agent_path=str(profile))
              native = {"agent_role": ROLE, "model": "gpt-5.6-luna", "effort": "max"}
              native[field] = str(tmp_path / "other.toml") if field == "agent_path" else "external"
              payload = {
                  "expected": {"agent_role": ROLE, "model": "gpt-5.6-luna", "effort": "max"},
                  "native": native,
                  "rollout": {"thread_id": THREAD, "sessions_dir": str(sessions)},
              }
              result = subprocess.run(
                  [sys.executable, str(EVIDENCE)], cwd=ROOT, input=json.dumps(payload),
                  text=True, capture_output=True, check=False,
              )
              output = json.loads(result.stdout)
              assert output["decision"] == "quarantine"
              assert f"source_conflict:{field}" in output["violations"]
          '''
          new = '''def test_runtime_evidence_reports_exact_task_path_and_provider_control(tmp_path: Path):
              task_path = "/root/sd_runtime_worker"
              sessions = tmp_path / "sessions"
              write_rollout(sessions, agent_path=task_path)
              payload = {
                  "expected": {
                      "agent_role": ROLE, "model": "gpt-5.6-luna", "effort": "max",
                      "agent_path": task_path, "model_provider": "openai",
                  },
                  "native": {"agent_role": ROLE, "model": "gpt-5.6-luna", "effort": "max"},
                  "rollout": {"thread_id": THREAD, "sessions_dir": str(sessions)},
              }
              result = subprocess.run(
                  [sys.executable, str(EVIDENCE)], cwd=ROOT, input=json.dumps(payload),
                  text=True, capture_output=True, check=False,
              )
              assert result.returncode == 0, result.stderr
              output = json.loads(result.stdout)
              assert output["task_path_observation"] == {
                  "status": "verified",
                  "observed_agent_path": task_path,
              }
              assert output["provider_control_assurance"]["status"] == "verified"
              assert output["truth_layers"]["observed_auxiliary"]["fields"]["agent_path"] == task_path


          def test_runtime_evidence_rejects_filesystem_path_as_v2_agent_path(tmp_path: Path):
              sessions = tmp_path / "sessions"
              write_rollout(sessions, agent_path=str(tmp_path / "owned.toml"))
              payload = {
                  "expected": {"agent_role": ROLE, "model": "gpt-5.6-luna", "effort": "max"},
                  "rollout": {"thread_id": THREAD, "sessions_dir": str(sessions)},
              }
              result = subprocess.run(
                  [sys.executable, str(EVIDENCE)], cwd=ROOT, input=json.dumps(payload),
                  text=True, capture_output=True, check=False,
              )
              assert result.returncode != 0
              assert "canonical V2 task path" in result.stderr


          @pytest.mark.parametrize("field", ["agent_path", "model_provider"])
          def test_runtime_evidence_fails_closed_on_public_rollout_task_path_or_provider_conflict(
              tmp_path: Path, field: str
          ):
              task_path = "/root/sd_runtime_worker"
              sessions = tmp_path / "sessions"
              write_rollout(sessions, agent_path=task_path)
              native = {"agent_role": ROLE, "model": "gpt-5.6-luna", "effort": "max"}
              native[field] = "/root/sd_other_worker" if field == "agent_path" else "external"
              payload = {
                  "expected": {"agent_role": ROLE, "model": "gpt-5.6-luna", "effort": "max"},
                  "native": native,
                  "rollout": {"thread_id": THREAD, "sessions_dir": str(sessions)},
              }
              result = subprocess.run(
                  [sys.executable, str(EVIDENCE)], cwd=ROOT, input=json.dumps(payload),
                  text=True, capture_output=True, check=False,
              )
              output = json.loads(result.stdout)
              assert output["decision"] == "quarantine"
              assert f"source_conflict:{field}" in output["violations"]


          def test_runtime_evidence_accepts_nested_canonical_v2_task_path():
              task_path = "/root/parent/child"
              payload = {
                  "expected": {
                      "agent_role": ROLE,
                      "model": "gpt-5.6-luna",
                      "effort": "max",
                      "agent_path": task_path,
                  },
                  "local": {
                      "agent_role": ROLE,
                      "model": "gpt-5.6-luna",
                      "effort": "max",
                      "agent_path": task_path,
                  },
              }
              result = subprocess.run(
                  [sys.executable, str(EVIDENCE)], cwd=ROOT, input=json.dumps(payload),
                  text=True, capture_output=True, check=False,
              )
              assert result.returncode == 0, result.stderr
              output = json.loads(result.stdout)
              assert output["task_path_observation"]["status"] == "verified"
          '''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one test block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Prove regression tests are red
        shell: bash
        run: |
          if python -m pytest -q tests/test_runtime_attestation.py -k 'task_path or v2_agent_path'; then
            echo 'expected V2 task-path regression tests to fail before implementation' >&2
            exit 1
          fi
      - name: Implement V2 task-path semantics and documentation
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path_text, old, new):
              path = Path(path_text)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path_text}: expected one match, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact('scripts/runtime-evidence.py',
              'import json\nfrom pathlib import Path\nimport sys\n',
              'import json\nfrom pathlib import Path\nimport re\nimport sys\n')
          replace_exact('scripts/runtime-evidence.py',
              'AUXILIARY_OBSERVED_FIELDS = ("agent_path", "model_provider", "cwd")\n',
              'AUXILIARY_OBSERVED_FIELDS = ("agent_path", "model_provider", "cwd")\nV2_AGENT_PATH = re.compile(r"^/root(?:/[A-Za-z0-9_][A-Za-z0-9._-]*)+$")\n')
          replace_exact('scripts/runtime-evidence.py',
              'def text(value: Any) -> str | None:\n    return value.strip() if isinstance(value, str) and value.strip() else None\n\n\ndef normalize(value: dict[str, Any] | None) -> dict[str, str | None] | None:\n',
              'def text(value: Any) -> str | None:\n    return value.strip() if isinstance(value, str) and value.strip() else None\n\n\ndef canonical_v2_agent_path(value: Any, label: str) -> str | None:\n    path = text(value)\n    if path is None:\n        return None\n    if V2_AGENT_PATH.fullmatch(path) is None:\n        fail(f"{label} must be a canonical V2 task path under /root")\n    return path\n\n\ndef normalize(value: dict[str, Any] | None) -> dict[str, str | None] | None:\n')
          replace_exact('scripts/runtime-evidence.py',
              '    if agent_role not in MANAGED_AGENT_TYPES and not (\n        agent_role and agent_role.startswith("subagents_dispatch_calibration_")\n    ):\n        fail("expected.agent_role is not a managed policy role")\n',
              '    if agent_role not in MANAGED_AGENT_TYPES and not (\n        agent_role and agent_role.startswith("subagents_dispatch_calibration_")\n    ):\n        fail("expected.agent_role is not a managed policy role")\n    canonical_v2_agent_path(expected.get("agent_path"), "expected.agent_path")\n')
          replace_exact('scripts/runtime-evidence.py',
              '        if field == "agent_path" and wanted is not None and got is not None:\n            try:\n                matches = Path(wanted).resolve(strict=True) == Path(got).resolve(strict=True)\n            except OSError:\n                matches = False\n        else:\n            matches = wanted == got\n',
              '        matches = wanted == got\n')
          replace_exact('scripts/runtime-evidence.py',
              '    accepted = normalize(obj(payload.get("accepted"), "accepted"))\n    native = normalize(obj(payload.get("native"), "native"))\n    local = normalize(obj(payload.get("local"), "local"))\n    native_permission_source = normalize_permission_source(\n',
              '    accepted = normalize(obj(payload.get("accepted"), "accepted"))\n    native = normalize(obj(payload.get("native"), "native"))\n    local = normalize(obj(payload.get("local"), "local"))\n    for label, observation in (("accepted", accepted), ("native", native), ("local", local)):\n        if observation is not None:\n            canonical_v2_agent_path(observation.get("agent_path"), f"{label}.agent_path")\n    native_permission_source = normalize_permission_source(\n')
          replace_exact('scripts/runtime-evidence.py',
              '        "profile_origin_observation": {\n',
              '        "task_path_observation": {\n')

          replace_exact('docs/runtime-attestation.md',
              'Formal `model_effort` calibration uses these Host-observed auxiliary fields as required controls. Public Host metadata and the exact rollout must agree where both expose them. `agent_path` must canonicalize to the exact committed campaign-owned profile path and that profile must still match its frozen SHA-256. `model_provider` must equal the provider frozen by the campaign. Missing evidence remains `UNKNOWN`; configured values and agent-type identity are never copied into Observed.\n',
              'Formal `model_effort` calibration uses these Host-observed auxiliary fields as required controls. Public Host metadata and the exact rollout must agree where both expose them. In Multi-Agent V2, `agent_path` is the Host-native canonical task path under `/root`, such as `/root/sd_n0_reader_a1`; it is task identity, not a profile-file path. When a gate uses it, it must match the expected canonical task path. Managed profile provenance is established separately from the exact `agent_type`, installed profile inventory, policy binding, and frozen profile bytes or digest. `model_provider` must equal the provider frozen by the campaign. Missing evidence remains `UNKNOWN`; configured values and agent-type identity are never copied into Observed.\n\nThis V2 interpretation is aligned to OpenAI Codex upstream source pinned in `docs/codex-v2-source-alignment.md`. The exact installed Host build remains the runtime acceptance authority when upstream and installed behavior differ.\n')
          replace_exact('tasks/host-qualification-runtime-evidence.md',
              'Use `scripts/host_qualification_evidence.py` only when the required fact is observable from the local Host-produced Codex rollout. Public Host metadata remains authoritative when it exposes the same fact; conflicting public and local evidence fails closed.\n',
              'Use `scripts/host_qualification_evidence.py` only when the required fact is observable from the local Host-produced Codex rollout. Public Host metadata remains authoritative when it exposes the same fact; conflicting public and local evidence fails closed.\n\nThe V2 task-path interpretation used here is source-aligned in `docs/codex-v2-source-alignment.md`. `session_meta.agent_path` is a canonical Host task address. It must never be used as profile-file provenance.\n')
          replace_exact('tasks/host-qualification-runtime-evidence.md',
              'Recognized current Agent-control names are `spawn_agent`, `followup_task`, `interrupt_agent`, and `list_agents`. Namespaced forms are normalized to their final tool name.\n',
              'Recognized current Agent-control names are `spawn_agent`, `followup_task`, `interrupt_agent`, and `list_agents`. Namespaced forms are normalized to their final tool name.\n\nCurrent upstream Codex V2 can expose collaboration tools to a spawned child when that child\'s effective model metadata enables V2. Therefore a zero recognized-call count is supporting evidence only. N1 still needs authoritative evidence that the managed child did not create or control descendants and that no descendant materialized.\n')
      - name: Run focused verification
        shell: bash
        run: |
          python -m pytest -q tests/test_runtime_attestation.py
          python -m ruff check scripts/runtime-evidence.py tests/test_runtime_attestation.py --ignore E402
          python scripts/package_integrity.py --write
          python scripts/package_integrity.py --check-generated
          python scripts/package_integrity.py
      - name: Review mutation scope
        shell: bash
        run: |
          git status --short
          git diff --check
          git diff -- scripts/runtime-evidence.py tests/test_runtime_attestation.py docs/runtime-attestation.md tasks/host-qualification-runtime-evidence.md .codex-plugin/package-integrity.json
          rm .github/workflows/apply-v2-runtime-evidence-fix.yml
          git diff --check
          unexpected="$(git status --short | awk '{print $2}' | grep -Ev '^(scripts/runtime-evidence.py|tests/test_runtime_attestation.py|docs/runtime-attestation.md|tasks/host-qualification-runtime-evidence.md|.codex-plugin/package-integrity.json|.github/workflows/apply-v2-runtime-evidence-fix.yml)$' || true)"
          test -z "$unexpected"
      - name: Commit verified change
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: align runtime evidence with Codex V2 task paths'
          git push origin HEAD:fix/host-runtime-evidence-resolvers
